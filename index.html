  const head = useT ? "Heute" : `Gestern${te.length?"":" · heute noch nichts"}`;
  if(!list.length) return `<div class="sechead">Heute und gestern</div><div class="glist">${grow(null,null,"Noch keine Aktivität","Trainings von der Garmin und aus der App erscheinen hier",null)}</div>`;
  return `<div class="sechead">${head} · ${fmtDate(d)}</div><div class="glist">${list.map(e=>grow(ic[e.k],col[e.k],esc(e.title),esc(e.sub),e.s!=null?fmt1(e.s):null)).join("")}</div>`;
}


/* ===== steps ===== */
function stepsOn(d){ const g=S.garmin.find(x=>x.date===d); return g&&g.steps!=null?g.steps:null; }
const fmtInt = n => Math.round(n).toLocaleString("de-CH");
function stepsRow(){
  const t=stepsOn(todayStr()); const g=S.garmin.find(x=>x.date===todayStr());
  const pct=t!=null?Math.min(100,t/STEP_GOAL*100):0;
  return `<div class="sechead">Schritte</div><button class="glist stepcard" data-act="goto" data-tab="fortschritt" data-sub="schritte">
    <span class="gicon" style="background:var(--c-veg)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 3c1.7 0 3 2 3 4.5S9.7 12 8 12 5 10 5 7.5 6.3 3 8 3zm-2 11h4v2.5a2 2 0 0 1-4 0zM16 7c1.7 0 3 2 3 4.5S17.7 16 16 16s-3-2-3-4.5S14.3 7 16 7zm-2 11h4v1.5a2 2 0 0 1-4 0z"/></svg></span>
    <span class="gt"><b>${t!=null?fmtInt(t):"–"} <span style="display:inline;font-size:14px">von ${fmtInt(STEP_GOAL)}</span></b><span class="bar" style="margin-top:6px"><i style="width:${pct}%;background:var(--c-veg)"></i></span>${g&&g.syncedAt?`<span style="margin-top:4px">Stand letzter Abgleich</span>`:""}</span>
    ${t!=null&&t>=STEP_GOAL?`<span class="gv" style="color:var(--c-veg)">✓</span>`:`<span class="gv">${t!=null?Math.round(pct)+" %":""}</span>`}${I2.chev}
  </button>`;
}
function stepsDetail(){
  const days=[]; for(let i=13;i>=0;i--) days.push(daysAgo(i));
  const vals=days.map(d=>({d,v:stepsOn(d)}));
  const have=vals.filter(x=>x.v!=null && x.d!==todayStr());
  const last7=have.filter(x=>x.d>=daysAgo(7));
  const avg=last7.length?last7.reduce((a,x)=>a+x.v,0)/last7.length:null;
  const hit=last7.filter(x=>x.v>=STEP_GOAL).length;
  const max=Math.max(STEP_GOAL*1.2,...vals.map(x=>x.v||0));
  const w=360,h=170,pad={l:30,r:6,t:14,b:22}; const Y=v=>pad.t+(1-v/max)*(h-pad.t-pad.b); const bw=(w-pad.l-pad.r)/vals.length;
  const grid=[0,5000,10000,15000,20000].filter(v=>v<=max).map(v=>`<line x1="${pad.l}" x2="${w-pad.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pad.l-5}" y="${Y(v)+4}" font-size="10" text-anchor="end" fill="var(--muted)">${v/1000}k</text>`).join("");
  const bars=vals.map((x,i)=>{ const X=pad.l+i*bw+bw*.18, W=bw*.64; const v=x.v||0; return `<rect x="${X}" y="${Y(v)}" width="${W}" height="${Math.max(0,Y(0)-Y(v))}" rx="3" fill="${v>=STEP_GOAL?"var(--c-veg)":"color-mix(in srgb,var(--c-veg) 45%,var(--surface2))"}"/><text x="${X+W/2}" y="${h-7}" font-size="9" text-anchor="middle" fill="var(--muted)">${new Date(x.d+"T12:00:00").toLocaleDateString("de-CH",{weekday:"short"}).slice(0,2)}</text>`; }).join("");
  const goal=`<line x1="${pad.l}" x2="${w-pad.r}" y1="${Y(STEP_GOAL)}" y2="${Y(STEP_GOAL)}" stroke="var(--fg)" stroke-dasharray="5 4" stroke-width="1.5"/>`;
  return `<section class="card">
    <div class="grid2">${stat("Heute",stepsOn(todayStr())!=null?fmtInt(stepsOn(todayStr())):"–","Schritte")}${stat("Ø 7 Tage",avg!=null?fmtInt(avg):"–","pro Tag")}${stat("Ziel erreicht",`${hit} / ${last7.length}`,`Tage ≥ ${fmtInt(STEP_GOAL)}`)}</div>
    <div class="chart"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Schritte pro Tag">${grid}${bars}${goal}</svg></div>
    <p class="small muted">Gestrichelte Linie: Ziel ${fmtInt(STEP_GOAL)}. Schritte kommen von der Garmin, der heutige Wert ist der Stand beim letzten Abgleich.</p>
  </section>`;
}

/* ===== kalorien (Garmin-Schätzung) ===== */
const KCAL_COL="#FF9F0A";
const I_FLAME='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c.5 3-1.2 4.8-2.6 6.4C8 10 7 11.6 7 14a5 5 0 0 0 10 0c0-1.7-.6-3.1-1.5-4.3-.3 1.4-1 2.3-2 2.8.4-3.3-.4-7.4-1.5-10.5z"/></svg>';
function kcalOn(d){ const g=S.garmin.find(x=>x.date===d); return g&&g.kcal!=null?{t:+g.kcal,a:+(g.kcalActive||0)}:null; }
function kcalAvg7(){ const l=[1,2,3,4,5,6,7].map(i=>kcalOn(daysAgo(i))).filter(Boolean); return l.length?{t:l.reduce((x,y)=>x+y.t,0)/l.length,a:l.reduce((x,y)=>x+y.a,0)/l.length,n:l.length}:null; }
function kcalRow(){
  const k=kcalOn(todayStr());
  return `<div class="sechead">Kalorien</div><button class="glist stepcard" data-act="goto" data-tab="fortschritt" data-sub="kalorien">
    <span class="gicon" style="background:${KCAL_COL}">${I_FLAME}</span>
    <span class="gt"><b>${k?fmtInt(k.t):"–"} <span style="display:inline;font-size:14px">kcal</span></b><span style="margin-top:4px">${k?`davon ${fmtInt(k.a)} aktiv · Garmin-Schätzung, bis letzter Abgleich`:"noch keine Daten"}</span></span>
    ${I2.chev}
  </button>`;
}
function kcalDetail(){
  const days=[]; for(let i=13;i>=0;i--) days.push(daysAgo(i));
  const vals=days.map(d=>({d,k:kcalOn(d)}));
  const a7=kcalAvg7(); const td=kcalOn(todayStr());
  const max=Math.max(3500,...vals.map(x=>x.k?x.k.t:0));
  const w=360,h=170,pad={l:34,r:6,t:14,b:22}; const Y=v=>pad.t+(1-v/max)*(h-pad.t-pad.b); const bw=(w-pad.l-pad.r)/vals.length;
  const grid=[0,1000,2000,3000,4000].filter(v=>v<=max).map(v=>`<line x1="${pad.l}" x2="${w-pad.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pad.l-5}" y="${Y(v)+4}" font-size="10" text-anchor="end" fill="var(--muted)">${v?v/1000+"k":0}</text>`).join("");
  const bars=vals.map((x,i)=>{ const X=pad.l+i*bw+bw*.18, W=bw*.64; const lbl=`<text x="${X+W/2}" y="${h-7}" font-size="9" text-anchor="middle" fill="var(--muted)">${new Date(x.d+"T12:00:00").toLocaleDateString("de-CH",{weekday:"short"}).slice(0,2)}</text>`;
    if(!x.k) return lbl; const r=x.k.t-x.k.a;
    return `<rect x="${X}" y="${Y(r)}" width="${W}" height="${Math.max(0,Y(0)-Y(r))}" rx="3" fill="color-mix(in srgb,${KCAL_COL} 35%,var(--surface2))"/><rect x="${X}" y="${Y(x.k.t)}" width="${W}" height="${Math.max(0,Y(r)-Y(x.k.t))}" rx="3" fill="${KCAL_COL}"/>${lbl}`; }).join("");
  return `<section class="card">
    <div class="grid2">${stat("Heute",td?fmtInt(td.t):"–","kcal bis jetzt")}${stat("Ø 7 Tage",a7?fmtInt(a7.t):"–","kcal pro Tag")}${stat("Ø aktiv",a7?fmtInt(a7.a):"–","kcal pro Tag")}</div>
    <div class="chart"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Kalorienverbrauch pro Tag">${grid}${bars}</svg></div>
    <p class="small muted">Hell: Ruheumsatz · Kräftig: aktive Kalorien. Werte kommen von der Garmin, heute ist der Stand beim letzten Abgleich.</p>
  </section>
  <section class="card"><h2>Wie genau ist das?</h2>
    <p class="small">Den <b>Ruheumsatz</b> rechnet Garmin aus Gewicht, Grösse, Alter und Geschlecht im Profil. Solche Formeln liegen bei den meisten Erwachsenen innerhalb von etwa ±10 %.</p>
    <p class="small">Die <b>aktiven Kalorien</b> schätzt die Uhr aus Puls und Bewegung. Das ist der ungenaue Teil: Eine Übersichtsarbeit fand bei allen Uhren-Marken mittlere Fehler über 30 %, bei Garmin-Modellen je nach Studie zwischen etwa −20 % und +50 %. Beim Krafttraining ist es besonders unsicher.</p>
    <p class="small">Realistisch heisst das für den ganzen Tag etwa <b>±10–15 %</b>, also bei 2700 kcal grob 2300–3100. Zum Vergleichen von Tagen und Wochen taugt es, zum genauen Rechnen nicht.</p>
  </section>`;
}

function splitFor(n){
  const S_ = window.SPLITS||{};
  const s=S_[n]; if(!s) return "";
  return `<div class="banner blue"><div class="eyebrow">Empfohlene Aufteilung für ${n} Tage</div><p><b>${esc(s.name)}</b></p><p class="small">${esc(s.days)}</p><p class="small muted">${esc(s.why)}</p></div>`;
}

/* ---------- interactions ---------- */
function readDraft(){
  const d=getDraft(); if(!d) return null;
  const dd=$("#d_date"); if(dd) d.date=dd.value||d.date;
  const du=$("#d_dur"); if(du) d.durationMin=num(du.value)||"";
  const dn=$("#d_note"); if(dn) d.note=dn.value;
  (d.entries||[]).forEach((e,i)=>e.sets.forEach((s,j)=>{ const w=$(`#s_${i}_${j}_w`),r=$(`#s_${i}_${j}_r`),x=$(`#s_${i}_${j}_x`); if(w) s.w=w.value; if(r) s.r=r.value; if(x) s.rir=x.value; }));
  return d;
}
function readPlanEdit(p){
  const out={...p}; const n=$("#pe_name"); if(n) out.name=n.value.trim()||p.name;
  const nt=$("#pe_note"); if(nt) out.note=nt.value;
  out.exercises=(p.exercises||[]).map((e,i)=>({ name:($(`#pe_${i}_name`)?.value||e.name).trim(), muscle:$(`#pe_${i}_muscle`)?.value||e.muscle, compound: $(`#pe_${i}_comp`) ? $(`#pe_${i}_comp`).value==="1" : isCompound(e), secondary: $(`#pe_${i}_muscle`) ? MAIN_MUSCLES.filter((m,k)=>$(`#pe_${i}_sec_${k}`)?.checked && m!==$(`#pe_${i}_muscle`).value) : secOf(e), metric: $(`#pe_${i}_metric`) ? $(`#pe_${i}_metric`).value : (e.metric||undefined), sets:num($(`#pe_${i}_sets`)?.value)||null, reps:$(`#pe_${i}_reps`)?.value||"", weight:num($(`#pe_${i}_weight`)?.value)||null, note:$(`#pe_${i}_note`)?.value||"" }));
  return out;
}
let planDraft=null;

function bind(){
  const v=$("#view");
  v.oninput = (ev)=>{ if(getDraft() && ev.target.closest("#view")) { const d=readDraft(); if(d) setDraft(d); } };
  v.onchange = async (ev)=>{
    const t=ev.target;
    if(t.id==="prog_sel"){ ui.progEx=t.value; lsSet("tb_ui",ui); t.blur(); render(); }
    if(t.dataset.act==="wdtoggle"){ const wk=isoWeek(); const wd=["Mo","Di","Mi","Do","Fr","Sa","So"]; const sel=wd.filter((d,i)=>$("#wd_"+i).checked); const cur=S.weeks[wk]||{}; await save("weeks/"+wk,{...cur,week:wk,weekdays:sel,days:cur.days||sel.length||null}); }
    if(/^pe_\d+_(muscle|metric)$/.test(t.id) && planDraft){ planDraft=readPlanEdit(planDraft); t.blur(); renderPlanDraft(); }
  };
  v.onclick = async (ev)=>{
    const b=ev.target.closest("[data-act]"); if(!b || b.tagName==="INPUT") return;
    const a=b.dataset.act;
    if(a==="start"){
      const p=S.plans.find(x=>x.id===b.dataset.id);
      const d={ id:uid(), date:todayStr(), planId:p?.id||null, planName:p?.name||"Freies Training", kind:p?.kind||"kraft", entries:(p?.exercises||[]).filter(e=>!(b.dataset.planned && (prof().planned?.skip||[]).includes(e.name))).map(e=>({name:e.name,muscle:e.muscle,metric:metricOf(e),reps:e.reps||"",secondary:secOf(e),compound:isCompound(e),target:[e.sets?e.sets+"×":"",e.reps||"",e.weight?" @ "+e.weight+" kg":""].join(""),note:e.note||"",sets:Array.from({length:e.sets||3},()=>({w:"",r:"",rir:""}))})) };
      setDraft(d); if(tab!=="training"){ location.hash="training"; } else { render(); scrollTop(); }
    }
    if(a==="cancel"){ const dd=readDraft(); const touched = dd && ((dd.note||"").trim() || (dd.entries||[]).some(e=>e.sets.some(x=>x.w!==""||x.r!==""||(x.rir??"")!==""))); if(!touched) b.dataset.confirm="1";
      if(b.dataset.confirm){ setDraft(null); setDraft(null); render(); } else { b.dataset.confirm="1"; b.textContent="Eingaben gehen verloren – nochmals tippen"; } }
    if(a==="addset"){ const d=readDraft(); const e=d.entries[+b.dataset.i]; const l=e.sets.at(-1)||{}; e.sets.push({w:l.w||"",r:"",rir:""}); setDraft(d); render(); }
    if(a==="rmset"){ const d=readDraft(); d.entries[+b.dataset.i].sets.splice(+b.dataset.j,1); setDraft(d); render(); }
    if(a==="rmex"){ const d=readDraft(); d.entries.splice(+b.dataset.i,1); setDraft(d); render(); }
    if(a==="addex"){ const s=$("#d_addsel"); if(!s.value) return; const d=readDraft(); const L=LIBMAP[s.value]; d.entries.push({name:L.name,muscle:L.muscle,metric:metricOf(L),reps:metricOf(L)==="dist"?"":defaultReps(L),secondary:secOf(L),compound:isCompound(L),sets:[{w:"",r:"",rir:""},{w:"",r:"",rir:""},{w:"",r:"",rir:""}]}); setDraft(d); render(); }
    if(a==="finish"){
      const d=readDraft();
      const entries=(d.entries||[]).map(e=>{ const dist=metricOf(e)==="dist"; return {name:e.name,muscle:e.muscle,metric:metricOf(e),secondary:secOf(e),reps:e.reps||"",sets: dist ? e.sets.filter(s=>s.r!==""||(s.rir??"")!=="").map(s=>({m:num(s.r),t:(s.rir||"").trim()||null,w:num(s.w)})) : e.sets.filter(s=>s.w!==""||s.r!=="").map(s=>({w:num(s.w),r:num(s.r),rir:s.rir===""?null:num(s.rir)}))}; }).filter(e=>e.sets.length);
      if(d.kind!=="cardio" && !entries.length){ toast("Trage mindestens einen Satz oder eine Runde ein"); return; }
      b.disabled=true;
      const ok=await save("logs/"+d.id,{date:d.date,planId:d.planId,planName:d.planName,kind:d.kind||"kraft",durationMin:d.durationMin||null,note:d.note||"",entries,savedAt:new Date().toISOString()});
      if(ok){ setDraft(null); toast("Training gespeichert"); render(); } else b.disabled=false;
    }
    if(a==="dellog"){ if(b.dataset.confirm){ await save("logs/"+b.dataset.id,null,"delete"); toast("Gelöscht"); } else { b.dataset.confirm="1"; b.textContent="Sicher?"; } }
    if(a==="editplan"){ ui.editPlan=b.dataset.id; planDraft=JSON.parse(JSON.stringify(S.plans.find(x=>x.id===ui.editPlan))); renderPlanDraft(); }
    if(a==="closeplan"){ ui.editPlan=null; planDraft=null; render(); }
    if(a==="addplanex"){ planDraft=readPlanEdit(planDraft); planDraft.exercises.push(planDraft.kind==="hyrox"?{name:"",muscle:"Ganzkörper",sets:1,reps:""}:{name:"",muscle:"Unbekannt",sets:3,reps:"8-12"}); renderPlanDraft(); }
    if(a==="delex"){ planDraft=readPlanEdit(planDraft); planDraft.exercises.splice(+b.dataset.i,1); renderPlanDraft(); }
    if(a==="mvex"){ planDraft=readPlanEdit(planDraft); const i=+b.dataset.i, j=i+(+b.dataset.d); const ex=planDraft.exercises; [ex[i],ex[j]]=[ex[j],ex[i]]; renderPlanDraft(); }
    if(a==="saveplan"){ const p=readPlanEdit(planDraft); p.exercises=(p.exercises||[]).filter(e=>e.name).map(e=>{ if((!e.muscle||e.muscle==="Unbekannt") && LIBMAP[e.name]) e.muscle=LIBMAP[e.name].muscle; return e; }); const {id,...body}=p; const ok=await save("plans/"+id,body); if(ok){ ui.editPlan=null; planDraft=null; toast("Plan gespeichert"); render(); } }
    if(a==="delplan"){ if(b.dataset.confirm){ await save("plans/"+b.dataset.id,null,"delete"); ui.editPlan=null; planDraft=null; render(); } else { b.dataset.confirm="1"; b.textContent="Wirklich löschen?"; } }
    if(a==="newplan"){ const n=$("#np_name").value.trim(); if(!n){ toast("Gib dem Plan einen Namen"); return; } const id="p_"+uid(); const ok=await save("plans/"+id,{name:n,kind:$("#np_kind").value,order:S.plans.length+1,exercises:[]}); if(ok){ ui.editPlan=id; planDraft={id,name:n,kind:$("#np_kind")?.value||"kraft",exercises:[]}; renderPlanDraft(); } }
    if(a==="addbw"){ const kg=num($("#bw_kg").value), d=$("#bw_date").value||todayStr(); if(!kg||kg<30||kg>250){ toast("Gib ein Gewicht in kg ein"); return; } const ok=await save("bodyweight/"+d,{date:d,kg}); if(ok){ $("#bw_kg").value=""; toast("Gewicht eingetragen"); } }
    if(a==="sub"){ ui[b.dataset.key]=b.dataset.k; lsSet("tb_ui",ui); render(); scrollTop(); return; }
    if(a==="goto"){ if(b.dataset.sub) { ui.progSub=b.dataset.sub; lsSet("tb_ui",ui); } if(location.hash.slice(1)===b.dataset.tab){ render(); scrollTop(); } else location.hash=b.dataset.tab; return; }
    if(a==="vacation"){ const on=!(prof().vacation&&prof().vacation.on); await save("settings/profile",{vacation:{on,since:todayStr()}},"update"); toast(on?"Ferienmodus an":"Ferienmodus aus"); return; }
    if(a==="shopchk"){ const sh=S.shop; if(!sh) return; const c={...(sh.checked||{})}; c[b.dataset.id]=!c[b.dataset.id]; S.shop={...sh,checked:c}; render(); await save("shopping/current",{checked:c},"update"); return; }
    if(a==="shopadd"){ const v=$("#shop_new").value.trim(); if(!v||!S.shop) return; const ex=[...(S.shop.extra||[]),v]; S.shop={...S.shop,extra:ex}; render(); await save("shopping/current",{extra:ex},"update"); return; }
    if(a==="shopbudget"){ const v=num($("#shop_budget").value); if(!v||v<=0){ toast("Gib ein Budget in CHF ein"); return; } await save("settings/profile",{shopBudget:v},"update"); toast("Budget gespeichert"); return; }
    if(a==="bodysub"){ ui.body=b.dataset.k; lsSet("tb_ui",ui); render(); }
    if(a==="addsleep"){ const hh=num($("#sl_h").value)||0, mm=num($("#sl_m").value)||0, d=$("#sl_date").value||todayStr(); const h=hh+mm/60; if(h<=0||h>16){ toast("Gib die Schlafdauer ein"); return; } const ok=await save("sleep/"+d,{date:d,h:Math.round(h*100)/100}); if(ok){ toast("Schlaf gespeichert"); } }
    if(a==="addrun"){ const km=num($("#run_km").value), mi=num($("#run_min").value), d=$("#run_date").value||todayStr(); if(!km||km<=0){ toast("Gib die Distanz in km ein"); return; } const ok=await save("runs/r_"+uid(),{date:d,km,min:mi||null,name:"Lauf"}); if(ok){ toast("Lauf gespeichert"); } }
    if(a==="delrun"){ if(b.dataset.confirm){ await save("runs/"+b.dataset.id,null,"delete"); } else { b.dataset.confirm="1"; b.textContent="?"; } }
    if(a==="setdays"){ const wk=isoWeek(); const cur=S.weeks[wk]||{}; await save("weeks/"+wk,{...cur,week:wk,days:+b.dataset.n}); }
  };
}
function renderPlanDraft(){
  document.activeElement?.blur?.();
  const v=$("#view"); v.innerHTML=vPlanEdit(planDraft); bind();
}
// keep plan edits when db snapshots arrive
const _vPlaene=vPlaene;
vPlaene=function(){ if(ui.editPlan && planDraft) return vPlanEdit(planDraft); return _vPlaene(); };

route();
boot();
</script>
