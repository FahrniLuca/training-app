<style>
/* Layout: dark training dashboard (single dark theme by choice): one column of cards, floating 5-tab bar; recovery traffic-light colours + one electric-blue accent. */
:root{
  --bg:#08090B; --surface:#131519; --surface2:#1B1E24; --sunk:#0E1013; --fg:#F2F4F7; --muted:#8C94A2; --line:#252931;
  --accent:#3D8BFF; --accent-ink:#04101F; --plate-red:#FF5A4E; --plate-yellow:#F5B83D; --plate-green:#2FD27A;
  --good:#2FD27A; --warn:#F5B83D; --bad:#FF5A4E;
  --c-prot:#FF6B5E; --c-veg:#3DD68C; --c-carb:#F7B93E; --c-fat:#5C9BFF; --c-kraft:#3D8BFF; --c-hyrox:#FF8A3D; --c-lauf:#2ED3B7; --c-ruhe:#A98BFF;
  --c-pre:#F7B93E; --c-pre2:#D9B26E; --c-during:#FF8A3D; --c-post:#3DD68C;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:16px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,input,select,label{touch-action:manipulation}
input[type="date"]{-webkit-appearance:none;appearance:none;display:block;text-align:left;line-height:1.3}
input::-webkit-date-and-time-value{text-align:left}
html,body{background:var(--bg);color:var(--fg);height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--f-body);font-size:15px;line-height:1.5}
#scroller{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(104px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:32px;text-transform:uppercase}
h2{font-size:22px;text-transform:uppercase}
h3{font-size:19px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:4px}
header.top > div{min-width:0}
header.top .pill{margin-bottom:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.grid2:has(> .stat:nth-child(3):last-child){grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid2:has(> .stat:nth-child(3):last-child) .stat{padding:10px}
.grid2:has(> .stat:nth-child(3):last-child) .stat b{font-size:17px;white-space:normal;overflow:visible;letter-spacing:-.03em}
.grid2:has(> .stat:nth-child(3):last-child) .stat span{font-size:11.5px;line-height:1.3}
.stat{background:var(--surface2);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-mono);font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:12px;color:var(--muted)}
button,.btn{font:600 15px var(--f-body);border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 14px;cursor:pointer;min-height:42px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent}
button.tiny{min-height:32px;padding:4px 10px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:16px var(--f-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:42px;min-width:0;width:100%}
input.num{font-family:var(--f-mono);text-align:center}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.acc{color:var(--accent)}
.plate{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .t{min-width:0;flex:1}
.li .t b{display:block;font-weight:600}
.li .t > span{display:block}
.exhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.exhead > :last-child{flex:none}
.iconrow{display:flex;gap:6px}
.form{display:grid;gap:10px}
.form.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.form.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.form .f{min-width:0}
.banner{border-radius:var(--r);padding:14px 16px;background:var(--sunk);border-left:4px solid var(--plate-yellow);display:flex;flex-direction:column;gap:6px}
.banner.blue{border-left-color:var(--accent)}
.ex{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.sets{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 56px 34px;gap:6px;align-items:center}
.sets .h{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:center}
.sets .n{font-family:var(--f-mono);color:var(--muted);text-align:center}
.tabs{position:fixed;z-index:20;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:560px;display:flex;justify-content:space-between;padding:5px 6px;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--line);border-radius:22px;box-shadow:0 6px 24px rgba(0,0,0,.14),0 1px 3px rgba(0,0,0,.08);transform:translateZ(0)}
.tabs a{flex:1;min-width:0;padding:7px 0 6px;border-radius:16px;text-align:center;color:var(--muted);text-decoration:none;font:600 11px var(--f-body);letter-spacing:-.01em;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs a svg{width:23px;height:23px}
.tabs a[aria-current="page"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.seg{display:flex;background:var(--sunk);border-radius:8px;padding:3px;gap:3px}
.seg button{flex:1;min-width:0;min-height:38px;border:0;background:transparent;font-size:15px;padding:4px 6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent)}
.daypick{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.daypick label{display:flex;min-width:0}
.daypick input{position:absolute;opacity:0;width:1px;height:1px}
.daypick span{flex:1;min-width:0;text-align:center;padding:8px 6px;border-radius:8px;border:1px solid var(--line);font-weight:600;cursor:pointer}
.daypick input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.daypick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
details{border-top:1px solid var(--line);padding-top:10px}
.stat.tint{background:color-mix(in srgb,var(--t) 13%,var(--surface));}
.stat.tint b{color:color-mix(in srgb,var(--t) 75%,var(--fg))}
.plate-row{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px}
.plate-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pg{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:10px;background:color-mix(in srgb,var(--t) 10%,var(--surface));min-width:0}
.pg > div{display:flex;flex-direction:column;gap:2px;min-width:0}
.pg-dot{width:12px;height:12px;border-radius:50%;background:var(--t);flex:none;margin-top:4px}
.pg-amt{font-family:var(--f-display);font-weight:700;font-size:17px;color:color-mix(in srgb,var(--t) 80%,var(--fg))}
.acc-list{display:flex;flex-direction:column;gap:8px}
details.acc{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--surface);overflow:hidden}
details.acc[open]{border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
details.acc summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px;cursor:pointer;font-weight:400}
details.acc summary::-webkit-details-marker{display:none}
.acc-ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--acc) 16%,var(--surface));color:var(--acc)}
.acc-ic svg{width:21px;height:21px}
.acc-tx{flex:1;min-width:0;display:flex;flex-direction:column}
.acc-tx b{font-size:16px}
.chev{color:var(--muted);transition:transform .2s;flex:none}
details.acc[open] .chev{transform:rotate(180deg)}
.acc-body{padding:4px 14px 14px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line)}
.acc-body > :first-child{margin-top:10px}
.tl-step{display:flex;gap:12px}
.tl-dot{width:10px;flex:none;border-radius:5px;background:var(--c-pre)}
.tl-body{display:flex;flex-direction:column;gap:4px;min-width:0}
.phase{align-self:flex-start;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;color:#fff}
.phase.pre,.tl-dot.pre{background:var(--c-pre)} .phase.pre2,.tl-dot.pre2{background:var(--c-pre2)} .phase.during,.tl-dot.during{background:var(--c-during)} .phase.post,.tl-dot.post{background:var(--c-post)}
.phase{color:#0A0B0D}
.supp-day{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sd{display:flex;flex-direction:column;gap:4px;padding:10px;border-radius:10px;background:color-mix(in srgb,var(--t) 12%,var(--surface));min-width:0}
.supp{border-left:4px solid var(--t);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:4px}
.exmeta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.pill.rest{color:var(--c-lauf);background:color-mix(in srgb,var(--c-lauf) 14%,var(--surface))}
.prog{display:flex;flex-direction:column;gap:2px;padding:9px 11px;border-radius:10px;border-left:4px solid var(--c-carb);background:color-mix(in srgb,var(--c-carb) 12%,var(--surface))}
.prog.up{border-left-color:var(--c-post);background:color-mix(in srgb,var(--c-post) 13%,var(--surface))}
.prog.new{border-left-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.prog b{font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:flex}
.chips input{position:absolute;opacity:0;width:1px;height:1px}
.chips span{padding:6px 11px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chips input:checked+span{background:color-mix(in srgb,var(--accent) 14%,var(--surface));border-color:var(--accent);color:var(--accent)}
.chips input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

.segtop{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--sunk) 92%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.seg button[aria-pressed="true"]{background:var(--surface2)!important;color:var(--fg)!important}
.hero{background:radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--accent) 14%,var(--surface)) 0%,var(--surface) 60%)}
.hero-top{display:flex;gap:16px;align-items:center}
.ring{width:132px;height:132px;flex:none}
.hero-tx{min-width:0;display:flex;flex-direction:column;gap:4px}
.hero-tx h2{font-size:24px}
.parts{display:flex;flex-direction:column;gap:8px}
.part{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center}
details.mini{border-top:0;padding-top:0}
.next .big{font-size:34px;line-height:1}
.wstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px}
.wd.fut{opacity:.5}
.wl{font-size:11px;color:var(--muted);font-weight:600}
.wc{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--surface2);color:var(--fg)}
.wc.on{color:#06080B}
.wc.plan{background:transparent;box-shadow:inset 0 0 0 2px var(--accent)}
.wd.today .wl{color:var(--accent)}
.wd.today .wc:not(.on){box-shadow:inset 0 0 0 2px var(--fg)}
.wdots{display:flex;gap:3px;height:6px}
.wdots i{width:6px;height:6px;border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:12px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.legend i.ring-i{box-shadow:inset 0 0 0 2px var(--accent)}
.loadbars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;height:96px}
.lb{display:flex;flex-direction:column;align-items:center;gap:4px}
.lbcol{flex:1;width:100%;display:flex;align-items:flex-end;background:var(--surface2);border-radius:8px;overflow:hidden}
.lbcol i{width:100%;background:color-mix(in srgb,var(--fg) 30%,var(--surface2));border-radius:8px;min-height:2px}
.lb span{font-size:11px;color:var(--muted)}
.vac{border-color:color-mix(in srgb,var(--c-ruhe) 50%,var(--line))}
.switch{width:52px;min-height:32px;height:32px;border-radius:999px;padding:3px;background:var(--surface2);border:1px solid var(--line);flex:none;display:flex}
.switch span{width:24px;height:24px;border-radius:50%;background:var(--muted);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--c-ruhe);border-color:var(--c-ruhe)}
.switch[aria-checked="true"] span{transform:translateX(20px);background:#fff}
.ex-list{display:flex;flex-wrap:wrap;gap:6px}
.food{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--sunk)}

details summary{cursor:pointer;font-weight:600}
details > div{padding-top:8px;display:flex;flex-direction:column;gap:6px}
.src{font-size:12px;color:var(--muted)}
.src a{color:var(--muted)}
a{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-weight:600;z-index:30}
.lock{display:flex;gap:10px;align-items:flex-start}
.bar{height:8px;border-radius:4px;background:var(--sunk);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px}
.bar .band{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--good) 25%,transparent)}
.musclerow{display:grid;grid-template-columns:110px 1fr 34px;gap:10px;align-items:center;font-size:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border-top:0}
.tablewrap{overflow-x:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ===== Apple-style dark layer (overrides) ===== */
:root{
  --bg:#000000; --surface:#1C1C1E; --surface2:#2C2C2E; --sunk:#000000; --fg:#FFFFFF; --muted:#98989F; --line:#38383A;
  --accent:#0A84FF; --accent-ink:#FFFFFF; --plate-red:#FF453A; --plate-yellow:#FFD60A; --plate-green:#30D158;
  --good:#30D158; --warn:#FF9F0A; --bad:#FF453A;
  --c-prot:#FF453A; --c-veg:#30D158; --c-carb:#FFD60A; --c-fat:#0A84FF; --c-kraft:#0A84FF; --c-hyrox:#FF9F0A; --c-lauf:#64D2FF; --c-ruhe:#BF5AF2;
  --c-pre:#FFD60A; --c-pre2:#E5C07B; --c-during:#FF9F0A; --c-post:#30D158;
  --c-strain:#0A84FF; --c-sleep:#BF5AF2;
  --f-display:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --f-mono:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
  --r:14px;
}
body{font-size:16px;letter-spacing:-.01em}
h1,h2,h3{font-family:var(--f-body);text-transform:none!important;letter-spacing:-.02em}
h1{font-size:34px;font-weight:700}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:600}
.eyebrow{font-family:var(--f-body);font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--muted)}
.wrap{gap:12px}
.card{border:0;border-radius:var(--r);padding:16px;gap:12px}
.stat{background:var(--surface2);border-radius:12px}
.stat b{font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:-.02em}
.mono,.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
button,.btn{font-family:var(--f-body);border:0;background:var(--surface2);border-radius:12px;font-size:16px;font-weight:600;color:var(--accent)}
button.primary{background:var(--accent);color:#fff;min-height:50px}
button.ghost{background:transparent;color:var(--accent)}
button.tiny{background:transparent;color:var(--accent);font-weight:500;padding:4px 6px}
input,select,textarea{background:var(--surface2);border:0;border-radius:10px;font-family:var(--f-body)}
label.f{font-size:13px}
.pill{background:var(--surface2);font-weight:600;font-size:12px}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent)} .pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent)} .pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent)} .pill.acc{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.seg{background:rgba(118,118,128,.24);border-radius:9px;padding:2px;gap:0}
.seg button{color:var(--fg);font-weight:600;font-size:14px;min-height:32px;border-radius:7px}
.seg button[aria-pressed="true"]{background:#636366!important;color:#fff!important}
.segtop{background:#232326;backdrop-filter:none;-webkit-backdrop-filter:none;border-radius:10px;box-shadow:0 0 0 6px var(--bg)}
.seg button{color:#D1D1D6}
.li{border-top:.5px solid var(--line)}
.banner{background:var(--surface);border-left:0;border-radius:var(--r)}
.ex{background:var(--surface);border:0;border-radius:var(--r)}
.src{display:none}
details .src,.acc-body .src{display:block}
details{border-top:.5px solid var(--line)}
header.top{padding-top:8px}
header.top .pill{background:transparent;padding:0}
.tabs{background:rgba(28,28,30,.72);border:.5px solid rgba(255,255,255,.08);border-radius:28px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.tabs a{font-family:var(--f-body);font-size:10.5px;font-weight:500;border-radius:22px}
.tabs a[aria-current="page"]{background:rgba(255,255,255,.1);color:var(--accent)}
.hero{background:var(--surface)}
.next .big{font-family:var(--f-body);font-size:28px;font-weight:700}

<script>
/* ---------- static knowledge ---------- */
const MUSCLES = ["Brust","Rücken","Schultern","Bizeps","Trizeps","Quadrizeps","Beinbeuger","Gesäss","Waden","Bauch","Ganzkörper","Unbekannt"];
const LIB = [

 ["Bayesian Kabel-Curl","Bizeps","Langer Kopf, gedehnt","Kabel von hinten, Arm hinter dem Körper."],

 ["Überkopf-Trizepsstrecken Seil","Trizeps","Langer Kopf, gedehnt","Arm über dem Kopf dehnt den langen Kopf, der grösste Teil des Trizeps."],

 ["Rumänisches Kreuzheben","Beinbeuger","Beinbeuger + Gesäss, gedehnt","Hüftbeugung mit langer Dehnung."],
 ["Beinbeuger sitzend","Beinbeuger","Beinbeuger, gedehnt","Sitzend wächst der Beinbeuger mehr als liegend."],
 ["Beinbeuger liegend","Beinbeuger","Beinbeuger","Alternative, wenn kein Sitzgerät frei ist."],

 ["Wadenheben stehend","Waden","Wade (Gastrocnemius), gedehnt","Unten in der Dehnung arbeiten bringt am meisten."],

 ["Rudern (Ergometer)","Ganzkörper","Rücken + Beine, Hyrox-Station","Distanz und Zeit erfassen."],
 ["SkiErg","Ganzkörper","Lat + Rumpf, Hyrox-Station","Distanz und Zeit erfassen."],
 ["Kettlebell-Lunges","Ganzkörper","Beine + Gesäss","Ausfallschritte mit Kettlebells."],
 ["Sandbag-Lunges","Ganzkörper","Beine + Gesäss, Hyrox-Station","Distanz in Metern."],
 ["Sled Push","Ganzkörper","Beine, Hyrox-Station","Distanz und Gewicht."],
 ["Sled Pull","Ganzkörper","Rücken + Beine, Hyrox-Station","Distanz und Gewicht."],
 ["Burpee Broad Jumps","Ganzkörper","Ganzkörper, Hyrox-Station","Distanz in Metern."],
 ["Farmers Carry","Ganzkörper","Griff + Rumpf, Hyrox-Station","Distanz und Gewicht."],
 ["Laufen (Hyrox)","Ganzkörper","Ausdauer","Zwischen den Stationen, z. B. 1 km."],
 ["Kabel-Crunch","Bauch","Gerader Bauch","Gut steigerbar mit Gewicht."],
 ["Beinheben hängend","Bauch","Unterer Bauch + Hüftbeuger","Gleichzeitig Griffkraft."]
];
const LIBMAP = Object.fromEntries(LIB.map(l=>[l[0],{name:l[0],muscle:l[1],focus:l[2],why:l[3]}]));
const MAIN_MUSCLES = ["Brust","Rücken","Schultern","Bizeps","Trizeps","Quadrizeps","Beinbeuger","Gesäss","Waden","Bauch"];
/* indirectly trained muscles (count 0.5 set each), per Pelland et al. fractional counting */
const SEC = {
  "Kurzhantel-Bankdrücken":["Trizeps","Schultern"],"Schrägbank-Kurzhanteldrücken":["Trizeps","Schultern"],"Langhantel-Bankdrücken":["Trizeps","Schultern"],
  "Brustpresse Maschine":["Trizeps","Schultern"],"Dips":["Trizeps","Schultern"],"Enges Bankdrücken":["Brust","Schultern"],
  "T-Bar-Rudern":["Bizeps"],"Einarmiges Kabelrudern":["Bizeps"],"Klimmzüge (assistiert)":["Bizeps"],"Latziehen":["Bizeps"],
  "Brustgestütztes Rudern":["Bizeps"],"Kurzhantelrudern einarmig":["Bizeps"],
  "Schulterdrücken Maschine":["Trizeps"],"Schulterdrücken Langhantel":["Trizeps"],
  "Kniebeuge":["Gesäss"],"Hack-Squat":["Gesäss"],"Beinpresse":["Gesäss"],"Bulgarian Split Squat":["Gesäss"],
  "Rumänisches Kreuzheben":["Gesäss"],"Hip Thrust":["Beinbeuger"],
  "D102":["Brust","Trizeps"],"D106":["Schultern","Trizeps"]
};
const COMPOUND = new Set(["Kurzhantel-Bankdrücken","Schrägbank-Kurzhanteldrücken","Langhantel-Bankdrücken","Brustpresse Maschine","Dips","Enges Bankdrücken","T-Bar-Rudern","Einarmiges Kabelrudern","Klimmzüge (assistiert)","Latziehen","Brustgestütztes Rudern","Kurzhantelrudern einarmig","Schulterdrücken Maschine","Schulterdrücken Langhantel","Kniebeuge","Hack-Squat","Beinpresse","Bulgarian Split Squat","Rumänisches Kreuzheben","Hip Thrust","D102","D106"]);
const METRIC = {"Rudern (Ergometer)":"dist","SkiErg":"dist","Sandbag-Lunges":"dist","Sled Push":"dist","Sled Pull":"dist","Burpee Broad Jumps":"dist","Farmers Carry":"dist","Laufen (Hyrox)":"dist"};
const metricOf = e => e.metric || METRIC[e.name] || "reps";
const isHyroxEx = e => (e.muscle||LIBMAP[e.name]?.muscle)==="Ganzkörper";
const secOf = e => Array.isArray(e.secondary) ? e.secondary : (SEC[e.name]||[]);
const isCompound = e => e.compound!=null ? !!e.compound : (COMPOUND.has(e.name) || (SEC[e.name]||[]).length>0 || /drück|press|rudern|zieh|klimm|beuge|squat|kreuzheb|dips/i.test(e.name||""));
const restFor = e => isCompound(e) ? "2–3 min" : "1,5–2 min";
function defaultReps(e){ if(/seitheben|wade|face pull|reverse butterfly/i.test(e.name||"")) return "10-15"; if(/bankdrück|t-bar|schulterdrück|kniebeuge|kreuzheb|hack-squat|beinpresse/i.test(e.name||"")) return "5-8"; return isCompound(e)?"6-10":"8-12"; }
function parseRange(r, comp){ const m=String(r||"").match(/(\d+)\s*[-–]\s*(\d+)/); if(m) return [+m[1],+m[2]]; const one=String(r||"").match(/^\s*(\d+)\s*$/); if(one) return [+one[1],+one[1]]; return comp?[6,10]:[8,12]; }
function weightStep(e,w){ if(/kurzhantel/i.test(e.name)) return 2; if(/langhantel|t-bar|kniebeuge|kreuzheb|hip thrust|bankdrücken/i.test(e.name)) return 2.5; return Math.max(2.5, Math.round(w*0.05/2.5)*2.5); }
const fmtKg = v => (Math.round(v*100)/100).toString().replace(".",",");
/* double progression: reps first, then weight */
function progression(e){
  if(metricOf(e)==="dist" || isHyroxEx(e)) return null;
  const last=lastSetsFor(e.name);
  const comp=isCompound(e); const [lo,hi]=parseRange(e.reps, comp);
  if(!last) return {kind:"new", lo, hi, text:`Gewicht wählen, mit dem du ${lo}–${hi} Wdh schaffst (1–2 in Reserve).`};
  const sets=last.sets.filter(x=>num(x.r)>0);
  if(!sets.length) return null;
  const ws=sets.map(x=>num(x.w)||0); const top=Math.max(...ws);
  const topSets=sets.filter(x=>(num(x.w)||0)===top);
  const allTop=topSets.length>=Math.min(sets.length,2) && topSets.every(x=>num(x.r)>=hi);
  const assisted=/assistiert/i.test(e.name);
  if(top<=0){ return allTop ? {kind:"up", lo, hi, text:`Alle Sätze mit ${hi}+ Wdh geschafft. Zeit für Zusatzgewicht, z. B. 2,5–5 kg.`}
                            : {kind:"reps", lo, hi, target:sets.map(x=>Math.min(hi,num(x.r)+1)), text:`Eine Wiederholung mehr pro Satz, bis du überall ${hi} schaffst.`}; }
  if(assisted){ return allTop ? {kind:"up", lo, hi, w:Math.max(0,top-5), text:`Ziel erreicht. Unterstützung um 5 kg verringern: ${fmtKg(Math.max(0,top-5))} kg, dann wieder ab ${lo} Wdh aufbauen.`}
                              : {kind:"reps", lo, hi, w:top, target:topSets.map(x=>Math.min(hi,num(x.r)+1)), text:`Gleiche Unterstützung (${fmtKg(top)} kg), eine Wiederholung mehr pro Satz bis ${hi}.`}; }
  if(allTop){ const nw=top+weightStep(e,top); return {kind:"up", lo, hi, w:nw, text:`${fmtKg(nw)} kg (oder nächste Stufe), Ziel ${lo}+ Wdh.`}; }
  return {kind:"reps", lo, hi, w:top, target:topSets.map(x=>Math.min(hi,num(x.r)+1)), text:`${fmtKg(top)} kg, pro Satz +1 Wdh (bis ${hi}).`};
}

/* Evidence base, researched and cross-checked Nov 2026 */
const EVIDENCE = [
 {t:"Kalorien von der Uhr", c:"hoch", r:"Uhren schätzen den Kalorienverbrauch ungenau: Über alle Marken lag der mittlere Fehler bei über 30 %, bei Garmin-Modellen je nach Studie etwa −20 % bis +50 %. Der Ruheumsatz aus Profilangaben ist deutlich genauer. Deshalb zeigt die App Kalorien nur zur Orientierung und rechnet nicht damit.", s:[{n:"Germini et al. 2022, J Med Internet Res 24(1):e30791", u:"https://www.jmir.org/2022/1/e30791"}]},
 {t:"Sätze pro Muskel und Woche", c:"hoch", r:"Mehr Sätze bringen mehr Wachstum, aber jeder weitere Satz bringt weniger. Sinnvoller Bereich: 10–20 Sätze pro Muskel und Woche. Indirekte Sätze zählen halb (Bankdrücken = 1 Satz Brust, 0,5 Satz Trizeps). Für Kraft reichen schon 4–8 Sätze pro Bewegung. Pro Einheit lohnen sich bis etwa 6–10 direkte Sätze für einen Muskel, darüber flacht es ab.", s:[{n:"Pelland et al. 2026, Sports Medicine 56(2):481–505", u:"https://sponet.de/sponet/Record/4097139"},{n:"Preprint mit allen Zahlen (SportRxiv)", u:"https://sportrxiv.org/index.php/server/preprint/view/460"}]},
 {t:"Jeden Muskel 2× pro Woche", c:"hoch", r:"Bei gleichem Wochenvolumen ist die Frequenz fürs Wachstum fast egal. 2× pro Woche verteilt die Sätze aber besser und hilft der Kraft leicht. Deshalb trifft jede empfohlene Aufteilung jeden Muskel etwa 2×.", s:[{n:"Schoenfeld, Ogborn & Krieger 2016, Sports Medicine 46:1689–1697", u:"https://link.springer.com/10.1007/s40279-016-0543-8"},{n:"Grgic, Schoenfeld & Latella 2019, J Sci Med Sport 22(3)", u:"https://ro.ecu.edu.au/ecuworkspost2013/5665"}]},
 {t:"Wiederholungen und Nähe zum Versagen", c:"hoch", r:"Muskeln wachsen mit leichten wie schweren Gewichten gleich gut, solange du nah ans Versagen gehst. Für Kraft sind schwerere Gewichte besser. Praxis: Grundübungen 4–8 Wdh mit 1–3 Wdh in Reserve (RIR), Isolationsübungen 8–15 Wdh mit 0–2 RIR. Echtes Muskelversagen bringt kaum mehr.", s:[{n:"Lopez et al. 2021, Med Sci Sports Exerc 53(6):1206–1216", u:"https://ro.ecu.edu.au/ecuworkspost2013/10364"},{n:"Refalo et al. 2024, Sports Medicine (Meta-Analyse Nähe zum Versagen)", u:"https://dro.deakin.edu.au/articles/journal_contribution/Influence_of_Resistance_Training_Proximity-to-Failure_on_Skeletal_Muscle_Hypertrophy_A_Systematic_Review_with_Meta-analysis/22030796"}]},
 {t:"Satzpausen", c:"mittel", r:"Pausen über 60 s sind fürs Wachstum leicht besser, ab etwa 90 s gibt es keinen Zusatznutzen mehr. Praxis: Isolation 1,5–2 min, schwere Grundübungen 2–3 min, damit das Gewicht gehalten werden kann.", s:[{n:"Singer et al. 2024, Front Sports Act Living 6:1429789", u:"https://www.frontiersin.org/journals/sports-and-active-living/articles/10.3389/fspor.2024.1429789/abstract"}]},
 {t:"Übungen mit Belastung in der Dehnung", c:"mittel", r:"Volle Bewegung mit Betonung der gedehnten Position ist die beste Grundregel. Beispiele aus Studien: Überkopf-Trizepsstrecken baute mehr Trizeps als Pushdowns (langer Kopf +28 % vs. +20 %), sitzender Beinbeuger mehr als liegender (+14 % vs. +9 %), zurückgelehntes Beinstrecken mehr Rectus femoris.", s:[{n:"Maeo et al. 2022/23, Eur J Sport Sci (Trizeps)", u:"https://sci-sport.com/en/triceps-hypertrophy-impact-of-arm-position/"},{n:"Maeo et al. 2021, Med Sci Sports Exerc 53(4) (Beinbeuger)", u:"https://sci-sport.com/en/hypertrophy-and-hamstring-protection-seated-prone-leg-curl/"},{n:"Wolf et al. 2023, Int J Strength Cond 3(1)", u:"https://doaj.org/article/99e86b317bec40f5abc2f0008358737e"}]},
 {t:"Bizeps: verschiedene Armpositionen", c:"mittel", r:"Schrägbank-Curls (Arm hinter dem Körper) bauten den oberen Bizeps stärker auf, Scott-Curls (Arm vor dem Körper) den unteren. Am besten beide Positionen kombinieren. Hammer-Curls für Brachialis und Unterarm stützen sich nur auf die Anatomie, nicht auf Langzeitstudien.", s:[{n:"Kassiano et al. 2025, Int J Sports Med 46(5):334–343", u:"https://sci-sport.com/en/effects-of-incline-and-preacher-curls-on-regional-hypertrophy-and-strength-266/"}]},
 {t:"Seitliche Schulter", c:"mittel", r:"Seitheben mit Kurzhantel und Kabel wirkten bei Trainierten gleich gut. Schulterdrücken trifft vor allem die vordere Schulter; für breitere Schultern braucht es Seitheben.", s:[{n:"Larsen et al. 2025, Front Physiol 16:1611468", u:"https://www.frontiersin.org/journals/physiology/articles/10.3389/fphys.2025.1611468/full"}]},
 {t:"Beine, Gesäss, Waden", c:"mittel", r:"Tiefe Kniebeugen bauen mehr Quadrizeps, Gesäss und Adduktoren als halbe. Hip Thrust und Kniebeuge brachten ähnlich viel Gesäss, die Kniebeuge zusätzlich Oberschenkel. Bei den Waden wirkte Wadenheben mit Fokus auf die gedehnte Position am besten.", s:[{n:"Plotkin et al. 2023, Front Physiol", u:"https://www.frontiersin.org/journals/physiology/articles/10.3389/fphys.2023.1279170/full"},{n:"Übersicht Kniebeugen-Tiefe (Stronger by Science)", u:"https://www.strongerbyscience.com/squat-depth/"},{n:"Kassiano et al. 2023, J Strength Cond Res 37(9)", u:"https://read.qxmd.com/read/37015016/"}]},
 {t:"Steigerung und Deload", c:"mittel", r:"Doppelte Progression: Im Wdh-Bereich (z. B. 8–12) erst die Wiederholungen steigern. Schaffst du in allen Sätzen das obere Ende, erhöhst du das Gewicht um 2–5 %. Eine Woche komplette Pause brachte Trainierten nichts. Wenn Entlastung, dann halbe Sätze mit 3–4 RIR, bei Leistungsabfall oder alle 6–10 Wochen.", s:[{n:"Coleman et al. 2024, PeerJ 12:e16777", u:"https://peerj.com/articles/16777"}]},
 {t:"Hyrox und Laufen neben Kraft", c:"hoch", r:"Bei moderatem Umfang bremst Ausdauertraining weder Muskelaufbau noch Maximalkraft. Laufen stört mehr als Radfahren, und in derselben Einheit leidet die Schnellkraft. Praxis: Hyrox mindestens 3 h, besser 24 h vom Beintraining trennen. Wenn am selben Tag, Kraft zuerst. 1–2 km Laufband nach dem Krafttraining sind unproblematisch.", s:[{n:"Schumann et al. 2022, Sports Medicine 52:601–612", u:"https://www.fisiologiadelejercicio.com/wp-content/uploads/2022/12/Compatibility-of-Concurrent-Aerobic-and-Strength-Training.pdf"},{n:"Wilson et al. 2012, J Strength Cond Res 26(8):2293–2307", u:"https://search.pedro.org.au/search-results/record-detail/34457"}]},
 {t:"Fett verlieren und Muskeln aufbauen", c:"mittel", r:"Gleichzeitig Fett verlieren und Muskeln aufbauen geht auch bei Trainierten, mit progressivem Training, viel Protein und genug Schlaf. Abnahmetempo höchstens 0,5–1 % pro Woche, für dich etwa 0,3–0,6 kg. Langsames Abnehmen erhielt in Studien mehr Muskelmasse.", s:[{n:"Barakat et al. 2020, Strength Cond J 42(5):7–21", u:"https://lida.sport-iat.de/ta/Record/4066252?lng=en"},{n:"Helms, Aragon & Fitschen 2014, JISSN 11:20", u:"https://pmc.ncbi.nlm.nih.gov/articles/PMC4033492/"}]},
 {t:"Protein", c:"hoch", r:"Bis etwa 1,6 g pro kg Körpergewicht steigt der Muskelaufbau, darüber kaum noch (oberer Schätzwert 2,2 g). Beim Abnehmen eher am oberen Ende. Auf 3–5 Mahlzeiten mit je 25–40 g verteilen. Die Tagesmenge ist wichtiger als das genaue Timing.", s:[{n:"Morton et al. 2018, Br J Sports Med 52(6):376", u:"https://bjsm.bmj.com/content/52/6/376.abstract"},{n:"Jäger et al. 2017, ISSN Position Stand Protein", u:"https://exerciseandsportnutritionlab.com/issn-updated-protein-exercise-position-stand-published/"}]},
 {t:"Essen vor Ausdauer", c:"hoch", r:"Vor Einheiten über 60 min 1–4 g Kohlenhydrate pro kg, 1–4 h vorher, wenig Fett und Ballaststoffe. Dauert es länger als 60 min, 30–60 g Kohlenhydrate pro Stunde während der Belastung.", s:[{n:"Thomas, Erdman & Burke 2016, zitiert in GSSI SSE #231", u:"https://www.gssiweb.org/en/sports-science-exchange/article/dietary-carbohydrate-and-the-endurance-athlete-contemporary-perspectives"}]},
 {t:"Kreatin", c:"hoch", r:"3–5 g Kreatin-Monohydrat täglich, Zeitpunkt egal. Ohne Ladephase sind die Speicher nach 3–4 Wochen voll. Bei Gesunden langfristig sicher.", s:[{n:"Kreider et al. 2017, ISSN Position Stand", u:"https://exerciseandsportnutritionlab.com/new-issn-position-stand-on-creatine-supplementation/"},{n:"Candow et al. 2022, Front Sports Act Living 4:893714", u:"https://www.frontiersin.org/journals/sports-and-active-living/articles/10.3389/fspor.2022.893714/pdf"}]},
 {t:"Vitamin D, Magnesium, Zink", c:"niedrig", r:"Vitamin D hilft der Kraft am ehesten bei einem Mangel; den Spiegel beim Arzt messen lassen. Für Magnesium und Zink gibt es ohne Mangel kaum Belege für mehr Leistung. Wichtig sind die Obergrenzen der EFSA: Vitamin D 100 µg (4000 IE) pro Tag, Magnesium aus Supplementen 250 mg pro Tag, Zink 25 mg pro Tag insgesamt.", s:[{n:"Zhang, Quan & Cao 2019, PLOS ONE 14(4):e0215826", u:"https://ideas.repec.org/a/plo/pone00/0215826.html"},{n:"EFSA Übersicht Obergrenzen 2024 (PDF)", u:"https://www.efsa.europa.eu/sites/default/files/2024-05/ul-summary-report.pdf"}]},
 {t:"Schlaf und Training", c:"mittel", r:"Ab 6 Stunden oder weniger Schlaf sinkt die Leistung messbar. Maximalkraft leidet wenig (etwa 3 %), Kraftausdauer und Ausdauer deutlich mehr (etwa 10 %). Je länger du nach einer kurzen Nacht wach bist, desto stärker der Effekt; Abendtraining leidet mehr als Morgentraining. Mehrere kurze Nächte wirken stärker als eine. Eine durchwachte Nacht senkte die Muskelproteinsynthese am Folgetag um 18 %. Für Erwachsene werden mindestens 7 Stunden empfohlen.", s:[{n:"Craven et al. 2022, Sports Medicine (Meta-Analyse, 77 Studien)", u:"https://lida.sport-iat.de/ta/Record/4078085"},{n:"Zusammenfassung Stronger by Science", u:"https://www.strongerbyscience.com/research-spotlight-sleep-loss/"},{n:"Lamon et al. 2021, Physiological Reports", u:"https://acuresearchbank.acu.edu.au/item/8w4w7/the-effect-of-acute-sleep-deprivation-on-skeletal-muscle-protein-synthesis-and-the-hormonal-environment"},{n:"Knowles et al. 2018, J Sci Med Sport (Übersicht Schlaf und Kraft)", u:"https://www.bisp-surf.de/Record/PU201810007708"}]},
 {t:"Ruhepuls und HRV als Erholungszeichen", c:"niedrig", r:"Ein Ruhepuls deutlich über deinem Normalwert oder eine HRV klar darunter kann auf Müdigkeit, Stress oder einen beginnenden Infekt hindeuten. Die App vergleicht mit deinem eigenen 30-Tage-Schnitt. Feste Grenzwerte sind wissenschaftlich nicht gut belegt; nimm es als Hinweis, nicht als Regel.", s:[]},
 {t:"Wiedereinstieg nach Krankheit", c:"niedrig", r:"Erst starten, wenn du symptomfrei bist und keine fiebersenkenden Mittel mehr nimmst. Woche 1 etwa 50–60 % der Sätze mit 3–4 RIR und kein Hyrox, Woche 2 etwa 80 %, danach normal. Bei Brustschmerz, starker Atemnot, Schwindel oder ungewöhnlich hohem Puls sofort aufhören und ärztlich abklären lassen. Nach Fieber besonders vorsichtig.", s:[{n:"Snyders et al. 2021, IOC-Konsens, Br J Sports Med", u:"https://www.up.ac.za/Sport-Exercise-Medicine-and-Lifestyle-Institute/news/post_3042925-medical-guidance-for-athletes-returning-to-sport-after-an-acute-respiratory-illness"},{n:"Bird et al. 2022, BJSM Blog", u:"https://blogs.bmj.com/bjsm/?p=10300"}]}
];

window.NUTRI = function(kg){

    ruhe:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
    pille:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="9" width="18" height="6" rx="3" transform="rotate(-35 12 12)"/><path d="M9.5 8.5l5 7"/></svg>'
  };
  const plate = [["--c-prot","Protein","1–2 Handflächen","Poulet, Rind, Fisch, Eier, Magerquark, Hüttenkäse, Skyr, Tofu. In jeder Mahlzeit."],

  const day = (rows)=>`<div class="tablewrap"><table><tbody>${rows.map(r=>`<tr><td class="small muted" style="white-space:nowrap">${r[0]}</td><td>${r[1]}</td><td class="num" style="text-align:right;white-space:nowrap">${r[2]}</td></tr>`).join("")}</tbody></table></div>`;
  return `<section class="card hero-n">
    <div class="row between"><h2>Dein Tagesziel</h2><span class="pill">bei ${kg.toFixed(1)} kg</span></div>
    <div class="grid2">
      <div class="stat tint" style="--t:var(--c-prot)"><span>Protein pro Tag</span><b>${cut}–${hi}</b><span>g, mindestens ${lo} g</span></div>
      <div class="stat tint" style="--t:var(--c-carb)"><span>Pro Mahlzeit</span><b>30–40</b><span>g Protein, 4× täglich</span></div>
      <div class="stat tint" style="--t:var(--c-veg)"><span>Abnahme pro Woche</span><b>0,3–0,6</b><span>kg im Wochenschnitt</span></div>
    </div>
    <p class="small muted">Kalorien musst du nicht zählen. Du steuerst über die Portionen unten und das Wochenmittel deines Gewichts.</p>
  </section>

  <section class="card">

    <div class="plate-grid">${plate.map(p=>`<div class="pg" style="--t:var(${p[0]})"><span class="pg-dot"></span><div><b>${p[1]}</b><span class="pg-amt">${p[2]}</span><span class="small muted">${p[3]}</span></div></div>`).join("")}</div>

    ${acc("--c-kraft",I.kraft,"Krafttraining","Push, Pull, Beine, Arme",

      `<p class="src">Helms 2014; ISSN 2017. Die Tagesmenge zählt mehr als das genaue Timing.</p>`)}

      step("pre2","30–60 min vorher","Kleiner Snack","Nur wenn die letzte Mahlzeit länger her ist.",["Banane","Reiswaffeln mit Honig"])+

      `<p class="src">Kohlenhydrate vor und während Belastungen über 60 min: Thomas, Erdman &amp; Burke 2016.</p>`)}
    ${acc("--c-ruhe",I.ruhe,"Ruhetag","Kein Training",
      step("pre","Den ganzen Tag","Protein bleibt gleich","Auch an Ruhetagen 4× 30–40 g Protein, denn der Muskel baut jetzt auf.",null)+
      step("pre2","Weniger","Kohlenhydrate eher 1 Faust","Dafür mehr Gemüse.",["Grosser Salat + Thunfisch","Gemüsepfanne + Tofu oder Poulet"]))}

/* ===== Offline-first Speicher + GitHub-Sync (wie To-Do-App) =====
   Alle Daten liegen lokal (localStorage) und in data.json im privaten Repo.
   Pro Dokument gewinnt der neuere Zeitstempel (_u). Gelöscht = _del:true. */
const LDB = (() => {
  const DKEY="tb.data", SKEY="tb.settings", YKEY="tb.sync", TTL=30*864e5;
  const now=()=>Date.now();
  const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}};
  let docs = ls.get(DKEY,{});            // path -> {...felder, _u, _del?}
  let settings = Object.assign({owner:"",repo:"training-data",path:"data.json",token:""}, ls.get(SKEY,{}));
  const sync = Object.assign({lastSync:0,dirty:false}, ls.get(YKEY,{}), {status:"idle",error:""});
  const colL=[], docL=[]; let seq=0;
  const persist=()=>{ if(!ls.set(DKEY,docs)) toast("Speicher auf dem Gerät voll"); };
  const saveSync=()=>ls.set(YKEY,{lastSync:sync.lastSync,dirty:sync.dirty});
  const clean=o=>{ const c={...o}; delete c._u; delete c._del; return c; };
  const live=p=>docs[p] && !docs[p]._del;
  function colSnap(l){
    const pre=l.name+"/";
    let arr=Object.keys(docs).filter(p=>p.startsWith(pre) && p.indexOf("/",pre.length)<0 && live(p)).map(p=>({id:p.slice(pre.length), obj:docs[p]}));
    if(l.order){ const [f,dir]=l.order; arr.sort((a,b)=>{ const x=a.obj[f], y=b.obj[f]; return (x<y?-1:x>y?1:0)*(dir==="desc"?-1:1); }); }
    if(l.limit) arr=arr.slice(0,l.limit);
    return {docs:arr.map(d=>({id:d.id, data:()=>clean(d.obj)})), metadata:{fromCache:false}};
  }
  const docSnap=p=>({id:p.split("/").pop(), exists:live(p), data:()=>live(p)?clean(docs[p]):undefined});
  function emit(){ colL.forEach(l=>{ try{l.cb(colSnap(l));}catch(e){console.error(e);} }); docL.forEach(l=>{ try{l.cb(docSnap(l.path));}catch(e){console.error(e);} }); }
  let emitT=null; const emitSoon=()=>{ clearTimeout(emitT); emitT=setTimeout(emit,0); };
  function write(path, obj){ docs[path]=obj; seq++; persist(); sync.dirty=true; saveSync(); emitSoon(); scheduleSync(1500); }
  function query(name, order, limit){
    return { orderBy:(f,dir)=>query(name,[f,dir||"asc"],limit), limit:n=>query(name,order,n),
      onSnapshot:(cb)=>{ const l={name,order,limit,cb}; colL.push(l); setTimeout(()=>cb(colSnap(l)),0); return ()=>colL.splice(colL.indexOf(l),1); } };
  }
  const db = {
    collection:name=>query(name,null,null),
    doc:path=>({
      onSnapshot:(cb)=>{ const l={path,cb}; docL.push(l); setTimeout(()=>cb(docSnap(path)),0); return ()=>docL.splice(docL.indexOf(l),1); },
      set:async data=>write(path,{...data,_u:now()}),
      update:async data=>write(path,{...(live(path)?docs[path]:{}),...data,_u:now(),_del:undefined}),
      delete:async()=>write(path,{_del:true,_u:now()})
    })
  };
  /* --- Sync --- */
  const configured=()=>!!(settings.owner&&settings.repo&&settings.path&&settings.token);
  let timer=null, syncing=false, again=false;
  function scheduleSync(ms){ clearTimeout(timer); timer=setTimeout(runSync,ms); }
  function merge(a,b){
    const out={}, cut=now()-TTL;
    for(const src of [a,b]) for(const [p,o] of Object.entries(src||{})){ if(!o) continue; const cur=out[p]; if(!cur || (o._u||0)>(cur._u||0)) out[p]=o; }
    for(const p of Object.keys(out)){ if(out[p]._del && (out[p]._u||0)<cut) delete out[p]; else if(out[p]._del===undefined) delete out[p]._del; }
    return out;
  }
  function serialize(d){ const o={}; Object.keys(d).sort().forEach(k=>o[k]=d[k]); return JSON.stringify({schema:1,docs:o},null,1)+"\n"; }
  const b64e=s=>{ const by=new TextEncoder().encode(s); let bin=""; for(let i=0;i<by.length;i+=0x8000) bin+=String.fromCharCode.apply(null,by.subarray(i,i+0x8000)); return btoa(bin); };
  const b64d=b=>{ const bin=atob(b.replace(/\s/g,"")); const by=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) by[i]=bin.charCodeAt(i); return new TextDecoder().decode(by); };
  const api=()=>`https://api.github.com/repos/${encodeURIComponent(settings.owner)}/${encodeURIComponent(settings.repo)}/contents/${settings.path.split("/").map(encodeURIComponent).join("/")}`;
  const H=()=>({Authorization:`Bearer ${settings.token}`,Accept:"application/vnd.github+json"});
  async function errText(r){ let m=""; try{m=(await r.json()).message||"";}catch(e){} if(r.status===401) return "Token ungültig oder abgelaufen (401)."; if(r.status===403) return "Keine Berechtigung (403). Token braucht «Contents: Read and write» für training-data."; if(r.status===404) return "Repo nicht gefunden (404). Benutzername/Repo prüfen."; return `GitHub ${r.status}: ${m}`; }
  async function fetchRemote(){
    const r=await fetch(api()+"?t="+now(),{cache:"no-store",headers:H()});
    if(r.status===404){ const r2=await fetch(`https://api.github.com/repos/${encodeURIComponent(settings.owner)}/${encodeURIComponent(settings.repo)}`,{cache:"no-store",headers:H()}); if(!r2.ok) throw new Error(await errText(r2)); return {data:{},sha:null}; }
    if(!r.ok) throw new Error(await errText(r));
    const j=await r.json(); let text=j.content?b64d(j.content):"";
    if(!j.content && j.size>0 && j.git_url){ const b=await fetch(j.git_url,{cache:"no-store",headers:H()}); text=b64d((await b.json()).content); }
    let d; try{ d=text.trim()?JSON.parse(text):{}; }catch(e){ throw new Error("data.json ist kein gültiges JSON."); }
    return {data:d.docs||{}, sha:j.sha};
  }
  async function runSync(){
    if(!configured()){ onStatus(); return; }
    if(!navigator.onLine){ sync.status="offline"; onStatus(); return; }
    if(syncing){ again=true; return; }
    syncing=true; sync.status="syncing"; onStatus();
    const s0=seq;
    try{
      let ok=false;
      for(let a=0;a<4&&!ok;a++){
        const {data:remote,sha}=await fetchRemote();
        const merged=merge(docs,remote); const out=serialize(merged);
        if(!sha || out!==serialize(remote)){
          const body={message:"Trainingsbuch: Update",content:b64e(out)}; if(sha) body.sha=sha;
          const r=await fetch(api(),{method:"PUT",headers:{...H(),"Content-Type":"application/json"},body:JSON.stringify(body)});
          if(r.status===409||r.status===422){ await new Promise(x=>setTimeout(x,400*(a+1))); continue; }
          if(!r.ok) throw new Error(await errText(r));
        }
        const changed = JSON.stringify(merged)!==JSON.stringify(docs);
        docs=merge(docs,merged); persist(); if(changed) emitSoon();
        ok=true;
      }
      if(!ok) throw new Error("Konflikt beim Speichern – bitte nochmals versuchen.");
      sync.lastSync=now(); sync.status="ok"; sync.error=""; sync.dirty=(seq!==s0); saveSync();
    }catch(e){
      sync.error=e&&e.message?e.message:String(e);
      sync.status=(!navigator.onLine||/Failed to fetch|NetworkError|Load failed/i.test(sync.error))?"offline":"error";
    }finally{
      syncing=false; onStatus();
      if(again||(sync.dirty&&sync.status==="ok")){ again=false; scheduleSync(800); }
    }
  }
  let onStatus=()=>{};
  window.addEventListener("online",()=>runSync());
  window.addEventListener("offline",()=>{ sync.status="offline"; onStatus(); });
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") runSync(); });
  setInterval(()=>{ if(document.visibilityState==="visible") runSync(); },60000);
  return { db, sync, configured, runSync,
    get settings(){ return settings; },
    setSettings(s){ settings=Object.assign(settings,s); ls.set(SKEY,settings); sync.status="idle"; sync.error=""; runSync(); },
    onStatus(fn){ onStatus=fn; },
    exportJSON(){ return serialize(docs); },
    importDocs(d){ docs=merge(docs,d); seq++; persist(); sync.dirty=true; saveSync(); emit(); scheduleSync(300); },
    count(){ return Object.keys(docs).filter(live).length; } };
})();

const writeQ = {};
async function save(path, data, mode="set"){
  if(!S.db){ toast("Keine Verbindung zum Speicher"); return false; }
  const prev = writeQ[path] || Promise.resolve();
  const p = prev.catch(()=>{}).then(()=> mode==="delete" ? S.db.doc(path).delete() : S.db.doc(path)[mode](data));
  writeQ[path]=p;
  try{ await p; return true; }catch(e){ toast(e.code==="quota_exceeded"?"Speicher voll":"Speichern fehlgeschlagen"); return false; }
}

  db.collection("weeks").onSnapshot(s=>{ S.weeks=Object.fromEntries(s.docs.map(d=>[d.id,d.data()])); render(); }, err);

  db.doc("nutrition/foods").onSnapshot(d=>{ S.foods=d.exists?d.data():null; render(); }, err);
  db.collection("runs").orderBy("date","desc").limit(300).onSnapshot(s=>{ S.runs=s.docs.map(d=>({id:d.id,...d.data()})); render(); }, err);
  db.doc("settings/profile").onSnapshot(d=>{ S.profile=d.exists?d.data():null; render(); }, err);
  if(!LDB.configured()) setTimeout(()=>{ if(!LDB.count()) syncSheet(); },400);

  if("serviceWorker" in navigator && location.protocol!=="file:") navigator.serviceWorker.register("sw.js").catch(()=>{});

function exCard(e,i){

  const pg = progression(e);
  const phW = j => pg && pg.w!=null ? fmtKg(pg.w).replace(",",".") : (last&&last.sets[j]?last.sets[j].w:"");
  const phR = j => pg && pg.kind==="reps" && pg.target ? (pg.target[j]??pg.target.at(-1)) : (pg && pg.kind==="up" ? pg.lo : (last&&last.sets[j]?last.sets[j].r:""));

  const wkFrom = daysAgo(6);

  </section>`;
  return part==="muskeln"?secM:secK;
}

function lineChart(pts,{unit="",w=360,h=190,color="var(--accent)",band=null}={}){
  if(!pts.length) return "";
  const pad={l:36,r:8,t:10,b:24};
  const ys=pts.map(p=>p.y); let lo=Math.min(...ys), hi=Math.max(...ys);
  if(band){ lo=Math.min(lo,band[0]); hi=Math.max(hi,band[1]); }
  if(hi-lo<1){ hi+=1; lo-=1; } const span=hi-lo; lo-=span*.08; hi+=span*.08;
  const t0=new Date(pts[0].x).getTime(), t1=new Date(pts.at(-1).x).getTime(); const tr=Math.max(1,t1-t0);
  const X=x=> pts.length===1 ? (pad.l+(w-pad.l-pad.r)/2) : pad.l+(new Date(x).getTime()-t0)/tr*(w-pad.l-pad.r);
  const Y=y=> pad.t+(1-(y-lo)/(hi-lo))*(h-pad.t-pad.b);
  const ticks=4; let g="";
  for(let i=0;i<=ticks;i++){ const v=lo+(hi-lo)*i/ticks; const y=Y(v); g+=`<line x1="${pad.l}" x2="${w-pad.r}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${pad.l-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="JetBrains Mono,monospace">${v.toFixed(span<10?1:0)}</text>`; }
  const d=pts.map((p,i)=>(i?"L":"M")+X(p.x).toFixed(1)+" "+Y(p.y).toFixed(1)).join(" ");
  const area = pts.length>1 ? `<path d="${d} L${X(pts.at(-1).x)} ${h-pad.b} L${X(pts[0].x)} ${h-pad.b} Z" fill="${color}" opacity=".12"/>` : "";
  const bandR = band ? `<rect x="${pad.l}" width="${w-pad.l-pad.r}" y="${Y(band[1])}" height="${Y(band[0])-Y(band[1])}" fill="var(--good)" opacity=".12"/>` : "";
  const last=pts.at(-1);
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Verlauf">${g}${bandR}${area}<path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="2.5" fill="${color}"/>`).join("")}<circle cx="${X(last.x)}" cy="${Y(last.y)}" r="5" fill="${color}"/><text x="${pad.l}" y="${h-8}" font-size="11" fill="var(--muted)">${fmtDate(pts[0].x)}</text><text x="${w-pad.r}" y="${h-8}" font-size="11" text-anchor="end" fill="var(--muted)">${fmtDate(last.x)}</text></svg>`;
}

    <button class="primary" data-act="addbw">Gewicht eintragen</button>
    ${bw.length?`<div class="grid2"><div class="stat"><span>Aktuell</span><b>${last.kg.toFixed(1)}</b><span>kg</span></div><div class="stat"><span>Schnitt 7 Tage</span><b>${a7?a7.toFixed(1):"–"}</b><span>${a7&&aPrev?`${(a7-aPrev>=0?"+":"")+(a7-aPrev).toFixed(1)} kg zur Vorwoche`:"kg"}</span></div><div class="stat"><span>Seit Start</span><b>${(last.kg-bw[0].kg>=0?"+":"")+(last.kg-bw[0].kg).toFixed(1)}</b><span>kg seit ${fmtDate(bw[0].date)}</span></div></div>

/* ---------- sleep + readiness ---------- */
const SLEEP_GOAL = 8; const STEP_GOAL = 10000;
function nights(){ const m={}; S.sleep.forEach(x=>{ if(x.h>0) m[x.date]={date:x.date,sleepH:x.h,src:"manuell"}; }); S.garmin.forEach(x=>{ if(x.sleepH!=null) m[x.date]={...x,src:"Garmin"}; }); return Object.values(m).sort((a,b)=>a.date<b.date?1:-1); }
function lastNight(){ const g=nights()[0]; if(!g) return null; const gd=S.garmin.find(x=>x.date===g.date)||{}; return (g.date>=daysAgo(1)) ? {...gd,...g} : null; }
function median(a){ if(!a.length) return null; const b=[...a].sort((x,y)=>x-y); const m=Math.floor(b.length/2); return b.length%2?b[m]:(b[m-1]+b[m])/2; }
function baselines(excludeDate){
  const rows=S.garmin.filter(x=>x.date!==excludeDate && x.date>=daysAgo(30));
  return { rhr: median(rows.map(x=>x.rhr).filter(v=>v>0)), hrv: median(rows.map(x=>x.hrv).filter(v=>v>0)), n: rows.length };
}
function readiness(){
  const g=lastNight(); if(!g) return null;
  const h=g.sleepH; const b=baselines(g.date);
  const recent=nights().filter(x=>x.date>=daysAgo(3)).slice(0,3);
  const shortNights=recent.filter(x=>x.sleepH<6).length;
  let level = h>=7?0 : h>=6?1 : h>=4.5?2 : 3;
  if(shortNights>=2 && level<3) level=Math.max(level,2)+ (level>=2?1:0);
  const flags=[];
  if(b.n>=7 && b.rhr && g.rhr && g.rhr>=b.rhr+5) flags.push(`Ruhepuls ${g.rhr} bpm, ${Math.round(g.rhr-b.rhr)} über deinem Schnitt`);
  if(b.n>=7 && b.hrv && g.hrv && g.hrv<b.hrv*0.85) flags.push(`HRV ${g.hrv} ms, deutlich unter deinem Schnitt von ${Math.round(b.hrv)}`);
  if(flags.length && level<3) level++;
  level=Math.min(level,3);
  const T=[
    {c:"good", t:"Normal trainieren", d:"Gut geschlafen. Ein guter Tag, um Gewicht oder Wiederholungen zu steigern."},
    {c:"warn", t:"Normal trainieren, nichts erzwingen", d:"Knapp unter deinem Ziel. Trainiere wie geplant, aber versuch keine neuen Rekorde, wenn es sich schwer anfühlt. Morgens oder mittags trainieren ist besser als spät am Abend."},
    {c:"warn", t:"Weniger Volumen", d:"Zu wenig Schlaf. Schwere Grundübungen leiden kaum, viele Wiederholungen und Ausdauer deutlich mehr. Mach pro Übung einen Satz weniger, bleib bei 2–3 Wiederholungen in Reserve und verschieb Hyrox oder einen harten Lauf auf einen ausgeschlafenen Tag."},
    {c:"bad", t:"Leichter Tag", d:"Sehr wenig Schlaf oder mehrere kurze Nächte. Der Muskelaufbau ist heute gebremst. Besser lockeres Training, Technik, Spazieren oder Pause, und heute Abend früh ins Bett."}
  ][level];
  return {g,h,level,flags,shortNights,...T};
}
function fmtH(h){ const H=Math.floor(h), M=Math.round((h-H)*60); return `${H} h ${String(M).padStart(2,"0")}`; }

    <h3>${r.t}</h3>

    ${r.flags.length?`<p class="small muted">Zusätzlich: ${r.flags.map(esc).join(" · ")}.</p>`:""}

const nightsList = () => nights();
function sleepBars(list,{w=360,h=170}={}){
  const pad={l:30,r:6,t:14,b:22}, max=Math.max(9,...list.map(n=>n.sleepH||0));
  const bw=(w-pad.l-pad.r)/list.length; const Y=v=>pad.t+(1-v/max)*(h-pad.t-pad.b);
  const bars=list.map((n,i)=>{ const x=pad.l+i*bw+bw*0.15, ww=bw*0.7; const lab=`<text x="${x+ww/2}" y="${h-8}" font-size="10" text-anchor="middle" fill="var(--muted)">${new Date(n.date+"T12:00:00").toLocaleDateString("de-CH",{weekday:"short"}).slice(0,2)}</text>`;
    if(n.sleepH==null) return lab+`<rect x="${x}" y="${Y(0)-2}" width="${ww}" height="2" fill="var(--line)"/>`;
    const c=n.sleepH>=SLEEP_GOAL?"var(--good)":n.sleepH>=6?"var(--warn)":"var(--bad)"; return `<rect x="${x}" y="${Y(n.sleepH)}" width="${ww}" height="${Y(0)-Y(n.sleepH)}" rx="3" fill="${c}"/>${lab}`; }).join("");
  const grid=[0,3,6,9].filter(v=>v<=max).map(v=>`<line x1="${pad.l}" x2="${w-pad.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pad.l-6}" y="${Y(v)+4}" font-size="10" text-anchor="end" fill="var(--muted)">${v} h</text>`).join("");
  const goal=`<line x1="${pad.l}" x2="${w-pad.r}" y1="${Y(SLEEP_GOAL)}" y2="${Y(SLEEP_GOAL)}" stroke="var(--fg)" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${w-pad.r}" y="${Y(SLEEP_GOAL)-5}" font-size="11" text-anchor="end" fill="var(--fg)">Ziel ${SLEEP_GOAL} h</text>`;
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Schlafdauer pro Nacht">${grid}${bars}${goal}</svg>`;
}
function weekDates(offset=0){ const d=new Date(); const dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow+offset*7); const out=[]; for(let i=0;i<7;i++){ const x=new Date(d); x.setDate(d.getDate()+i); out.push(x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")); } return out; }

/* bedtime regularity */
const hm2min = t => { if(!t) return null; const [h,m]=t.split(":").map(Number); return h*60+m; };
const bedMin = t => { const m=hm2min(t); return m==null?null:(m<720?m+1440:m); }; /* minutes after previous noon-ish: 23:00=1380, 01:00=1500 */
const min2hm = m => { m=((Math.round(m)%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); };
function sd(a){ if(a.length<2) return null; const mu=a.reduce((x,y)=>x+y,0)/a.length; return Math.sqrt(a.reduce((x,y)=>x+(y-mu)**2,0)/(a.length-1)); }
function bedtimeCard(list){
  list=list.slice(-7);
  const withT=list.filter(n=>n.sleepStart&&n.sleepEnd);
  if(!withT.length) return `<section class="card"><h2>Schlafenszeiten</h2><p class="small muted">Sobald Garmin Einschlaf- und Aufwachzeiten liefert, siehst du hier, wie regelmässig du schläfst.</p></section>`;
  const recent=withT.filter(n=>n.date>=daysAgo(6)); const base=recent.length?recent:withT;
  const beds=base.map(n=>bedMin(n.sleepStart)), wakes=base.map(n=>hm2min(n.sleepEnd));
  const avgBed=beds.reduce((a,b)=>a+b,0)/beds.length, avgWake=wakes.reduce((a,b)=>a+b,0)/wakes.length;
  const spread=sd(beds);
  const target=avgWake+1440-(SLEEP_GOAL*60+15);
  const w=360,h=list.length*22+30,pad={l:30,r:8,t:22,b:6};
  const t0=21*60, t1=35*60; /* 21:00 .. 11:00 next day */
  const X=m=>pad.l+(m-t0)/(t1-t0)*(w-pad.l-pad.r);
  const rowH=(h-pad.t-pad.b)/list.length;
  let grid=""; for(let m=t0;m<=t1;m+=120){ grid+=`<line x1="${X(m)}" x2="${X(m)}" y1="${pad.t-4}" y2="${h-pad.b}" stroke="var(--line)"/><text x="${X(m)}" y="${pad.t-8}" font-size="10" text-anchor="${m===t0?"start":m===t1?"end":"middle"}" fill="var(--muted)">${min2hm(m)}</text>`; }
  const bars=list.map((n,i)=>{ const y=pad.t+i*rowH+rowH*0.18, hh=rowH*0.64; const lab=`<text x="${pad.l-4}" y="${y+hh*0.8}" font-size="10" text-anchor="end" fill="var(--muted)">${new Date(n.date+"T12:00:00").toLocaleDateString("de-CH",{weekday:"short"}).slice(0,2)}</text>`;
    if(!n.sleepStart||!n.sleepEnd) return lab;
    const b=bedMin(n.sleepStart), e=hm2min(n.sleepEnd)+1440; const c=n.sleepH>=SLEEP_GOAL?"var(--good)":n.sleepH>=6?"var(--warn)":"var(--bad)";
    return lab+`<rect x="${X(Math.max(t0,b))}" y="${y}" width="${Math.max(2,X(Math.min(t1,e))-X(Math.max(t0,b)))}" height="${hh}" rx="3" fill="${c}"/>`; }).join("");
  const tl=`<line x1="${X(target)}" x2="${X(target)}" y1="${pad.t-4}" y2="${h-pad.b}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 3"/>`;
  return `<section class="card">
    <div class="row between"><h2>Schlafenszeiten</h2><span class="pill">letzte ${base.length} Nächte</span></div>
    <div class="grid2">
      ${stat("Ø Einschlafen",min2hm(avgBed),"Uhr")}
      ${stat("Ø Aufwachen",min2hm(avgWake),"Uhr")}
      ${stat("Schwankung",spread!=null?"± "+Math.round(spread)+" min":"–",spread==null?"ab 2 Nächten":spread<=30?"regelmässig":spread<=60?"etwas unregelmässig":"unregelmässig")}
    </div>
    <div class="chart"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Einschlaf- und Aufwachzeiten pro Nacht">${grid}${bars}${tl}</svg></div>
    <div class="banner blue"><p class="small"><b>Für ${SLEEP_GOAL} h Schlaf:</b> Bei deiner Aufwachzeit um ${min2hm(avgWake)} solltest du spätestens um <b>${min2hm(target)}</b> im Bett liegen (gestrichelte Linie, mit 15 min zum Einschlafen). Versuch, jeden Tag ungefähr zur gleichen Zeit ins Bett zu gehen, auch am Wochenende.</p></div>
    <p class="src">Regelmässige Schlafzeiten hängen in Beobachtungsstudien mit besserer Gesundheit zusammen; die Belege sind weniger stark als für die Schlafdauer.</p>
  </section>`;
}

}
const pace = (min,km)=>{ if(!min||!km) return "–"; const p=min/km; const mm=Math.floor(p), ss=Math.round((p-mm)*60); return `${mm}:${String(ss===60?59:ss).padStart(2,"0")}`; };

    <button data-act="addrun">Lauf speichern</button>

/* ---------- recovery score (simplified, own baseline) ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function recovery(){
  const g=lastNight(); if(!g) return null;
  const rows=S.garmin.filter(x=>x.date!==g.date && x.date>=daysAgo(30));
  const hv=rows.map(x=>x.hrv).filter(v=>v>0), rv=rows.map(x=>x.rhr).filter(v=>v>0);
  const parts=[];
  const sS=clamp((g.sleepH-4)/(SLEEP_GOAL-4),0,1)*100;
  parts.push({k:"Schlaf",v:sS,w:.4,txt:fmtH(g.sleepH)});
  const MINB=5;
  if(g.hrv && hv.length>=MINB){ const b=median(hv); parts.push({k:"HRV",v:clamp(50+(g.hrv/b-1)*250,0,100),w:.35,txt:`${g.hrv} ms (Basis ${Math.round(b)})`}); }
  if(g.rhr && rv.length>=MINB){ const b=median(rv); parts.push({k:"Ruhepuls",v:clamp(50-(g.rhr-b)*10,0,100),w:.25,txt:`${g.rhr} bpm (Basis ${Math.round(b)})`}); }
  const wsum=parts.reduce((a,p)=>a+p.w,0);
  let score=Math.round(parts.reduce((a,p)=>a+p.v*p.w,0)/wsum);
  const recent=nights().filter(x=>x.date>=daysAgo(3)).slice(0,3);
  const shortN=recent.filter(x=>x.sleepH<6).length;
  if(shortN>=2) score=Math.min(score,33);
  const level = score>=67?0 : score>=50?1 : score>=34?2 : 3;
  const T=[
    {c:"good", t:"Bereit für Fortschritt", d:"Gut erholt. Ein guter Tag, um Gewicht oder Wiederholungen zu steigern."},
    {c:"warn", t:"Normal trainieren, nichts erzwingen", d:"Trainiere wie geplant, aber versuch keine neuen Rekorde, wenn es sich schwer anfühlt."},
    {c:"warn", t:"Weniger Volumen", d:"Mach pro Übung einen Satz weniger und bleib bei 2–3 Wiederholungen in Reserve. Hyrox oder harte Läufe besser auf einen erholten Tag verschieben."},
    {c:"bad", t:"Leichter Tag", d:"Lockeres Training, Technik, Spazieren oder Pause. Heute Abend früh ins Bett."}
  ][level];
  return {g,score,level,parts,shortN,baseN:Math.min(hv.length,rv.length),needB:MINB,...T};
}
function ring(score,color){
  const r=54, c=2*Math.PI*r, off=c*(1-score/100);
  return `<svg class="ring" viewBox="0 0 132 132" role="img" aria-label="Erholung ${score} von 100"><circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="12"/><circle cx="66" cy="66" r="${r}" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 66 66)"/><text x="66" y="68" text-anchor="middle" dominant-baseline="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="700" font-size="44" fill="var(--fg)">${score}</text><text x="66" y="96" text-anchor="middle" font-size="11" fill="var(--muted)" letter-spacing="1.5">ERHOLUNG</text></svg>`;
}
function recoveryCard(){
  const r=recovery();
  if(!r) return `<section class="card"><h2>Erholung</h2><p class="small muted">Noch keine Schlafdaten von letzter Nacht. Sobald der Garmin-Abgleich läuft, siehst du hier deinen Erholungswert.</p></section>`;

  S.runs.forEach(r=>{ if(isoWeek(r.date)!==wkKey) return; min+=r.min||0; n++; days.add(r.date); });
  const sets=S.logs.filter(l=>isoWeek(l.date)===wkKey).reduce((a,l)=>a+(l.entries||[]).reduce((b,e)=>b+(e.sets||[]).length,0),0);

}

/* ---------- today ---------- */

/* ===== strain (Banister TRIMP, mapped to 0–21, non-linear) ===== */
const AGE = new Date().getFullYear()-2002;
const HRMAX = Math.round(208-0.7*AGE); /* Tanaka 2001 estimate */
function rhrRef(){ const v=S.garmin.filter(x=>x.rhr>0 && x.sleepH!=null && x.date>=daysAgo(30)).map(x=>x.rhr); return median(v)||55; }
function trimp(min,avg){ if(!min||!avg) return 0; const r=rhrRef(); const x=clamp((avg-r)/(HRMAX-r),0,1); return min*x*0.64*Math.exp(1.92*x); }
const to21 = t => 21*(1-Math.exp(-t/81));
function dayStrain(d){
  const items=[];
  const g=S.garmin.find(x=>x.date===d);
  (g?.activities||[]).forEach(a=>{ const t=trimp(a.min, a.avgHr||(a.type&&/strength/.test(a.type)?110:130)); items.push({name:a.name||a.type, start:a.start, min:a.min, t, kind:/run|lauf/i.test(a.type||"")?"lauf":/strength|kraft/i.test((a.type||"")+(a.name||""))?"kraft":/hiit|hyrox/i.test((a.type||"")+(a.name||""))?"hyrox":"other"}); });
  S.runs.filter(r=>r.date===d).forEach(r=>{ const t=trimp(r.min||r.km*6, 150); items.push({name:"Lauf (manuell)", min:r.min, t, kind:"lauf"}); });
  const sets=S.logs.filter(l=>l.date===d).reduce((a,l)=>a+(l.entries||[]).reduce((b,e)=>b+(e.sets||[]).filter(s=>num(s.r)>0).length,0),0);
  if(sets) items.push({name:"Harte Sätze (Muskelbelastung)", sets, t:sets*1.2, kind:"kraft"});
  /* Alltag: Schritte ausserhalb der Trainings, als lockeres Gehen (~100 Schritte/min bei ~33 % Herzfrequenzreserve) */
  if(g && g.steps>0){
    const actSteps=(g.activities||[]).reduce((a,x)=>a+(x.steps!=null?+x.steps:(/run|walk|treadmill|hik/i.test(x.type||"")&&x.km?x.km*1300:0)),0);
    const free=Math.max(0,g.steps-actSteps); const mins=free/100; const x=0.33;
    if(free>0) items.push({name:"Alltag", steps:Math.round(free), min:mins, t:mins*x*0.64*Math.exp(1.92*x), kind:"alltag"});
  }
  const total=items.reduce((a,i)=>a+i.t,0);
  return {strain:Math.round(to21(total)*10)/10, items:items.map(i=>({...i, s:Math.round(to21(i.t)*10)/10}))};
}
function strainTarget(level){ return [[12,16],[10,13],[7,10],[0,7]][level??1]; }
const strainBand = s => s>=18?"Maximal":s>=14?"Hoch":s>=10?"Moderat":"Leicht";
const fmt1 = v => String(v).replace(".",",");

  const R=[{r:64,v:strain/21,c:"var(--c-strain)"},{r:47,v:(rec??0)/100,c:recCol||"var(--good)"},{r:30,v:Math.min(1,sleepPct/100),c:"var(--c-sleep)"}];
  return `<svg class="rings" viewBox="0 0 150 150" role="img" aria-label="Belastung, Erholung und Schlaf">${R.map(x=>{ const c=2*Math.PI*x.r; return `<circle cx="75" cy="75" r="${x.r}" fill="none" stroke="${x.c}" stroke-opacity=".22" stroke-width="14"/><circle cx="75" cy="75" r="${x.r}" fill="none" stroke="${x.c}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-clamp(x.v,0,1))).toFixed(1)}" transform="rotate(-90 75 75)"/>`; }).join("")}</svg>`;
}

function ringsCard(){

  const ln=lastNight(); const sleepPct=ln?Math.round(ln.sleepH/SLEEP_GOAL*100):0;
  const recCol = !r?"var(--muted)":r.c==="good"?"var(--good)":r.c==="bad"?"var(--bad)":"var(--plate-yellow)";
  const inT = ds.strain>=tgt[0] && ds.strain<=tgt[1];
  return `<section class="card">
    <div class="rings-wrap">${rings3(ds.strain, r?r.score:0, sleepPct, recCol)}
      <div class="rlegend">
        <div class="rl"><span class="k" style="color:var(--c-strain)">Belastung</span><span class="v">${fmt1(ds.strain)}<small>/ 21</small></span><span class="s">Ziel ${tgt[0]}–${tgt[1]}${inT?" · erreicht ✓":ds.strain>tgt[1]?" · überschritten":""}</span></div>
        <div class="rl"><span class="k" style="color:${recCol}">Erholung</span><span class="v">${r?r.score:"–"}<small>%</small></span></div>
        <div class="rl"><span class="k" style="color:var(--c-sleep)">Schlaf</span><span class="v">${ln?fmtH(ln.sleepH).replace(" h ",":").replace(/^(\d+):/,"$1:"):"–"}<small>${ln?sleepPct+" %":""}</small></span></div>
      </div></div>
    ${r?`<div class="verdict"><span class="dot" style="background:${recCol}"></span><div><b>${r.t}</b><p class="small muted">${r.d}</p></div></div>`:""}
    <details class="info-d"><summary>Details und Berechnung</summary><div style="padding-top:8px">
      ${r?`<div class="parts">${r.parts.map(p=>`<div class="part"><span class="small muted">${p.k}</span><div class="bar"><i style="width:${Math.round(p.v)}%;background:${p.v>=67?"var(--good)":p.v>=34?"var(--warn)":"var(--bad)"}"></i></div><span class="small">${esc(p.txt)}</span></div>`).join("")}</div>`:""}
      ${r&&r.parts.length<3?`<p class="small muted">HRV und Ruhepuls zählen ab ${r.needB} Nächten Basis (jetzt ${r.baseN}).</p>`:""}
      <p class="small muted"><b>Belastung</b> (0–21): Dauer × Puls im Verhältnis zu Ruhepuls (${rhrRef()}) und geschätztem Maximalpuls (${HRMAX}), hohe Pulse zählen überproportional (Banister-TRIMP). Harte Sätze aus deinem Log zählen zusätzlich, weil der Puls Krafttraining unterschätzt. Auch Bewegung im Alltag zählt: Schritte ausserhalb der Trainings werden als lockeres Gehen gerechnet (etwa 5000 Schritte ≈ 4, 10 000 ≈ 8). Nicht linear: von 10 auf 20 ist viel schwerer als von 0 auf 10. Das Ziel richtet sich nach deiner Erholung.</p>
      <p class="small muted"><b>Erholung</b>: Schlaf 40 %, HRV 35 %, Ruhepuls 25 %, verglichen mit deinem 30-Tage-Median. <b>Schlaf</b>: Prozent von ${SLEEP_GOAL} Stunden. Vereinfachte, offene Formeln, keine medizinische Aussage.</p>
    </div></details>

}

function nextRow(){

  const kraft=S.plans.filter(p=>(p.kind||"kraft")==="kraft" && (p.exercises||[]).length).sort((a,b)=>(a.order??99)-(b.order??99));
  if(!kraft.length) return "";

  let next=kraft[0]; if(lastLog){ const i=kraft.findIndex(p=>p.id===lastLog.planId); next=kraft[(i+1)%kraft.length]; }
  const r=recovery(); const adj=r&&r.level>=2?" · heute 1 Satz weniger":"";

  const ps=prof().planned; const today=todayStr();

    const pp=S.plans.find(x=>x.id===ps.planId);

  }
  /* nach Push folgt ein freier Tag (Ruhetag, Hyrox oder Beine), solange Beine noch keine Übungen hat */
  if(lastLog && lastLog.planId==="push" && next.id!=="beine"){
    const since=Math.round((new Date(today+"T12:00:00")-new Date(lastLog.date+"T12:00:00"))/864e5);
    const flexDone=S.logs.some(l=>l.date>lastLog.date && l.date<=today && l.planId && !kraft.some(p=>p.id===l.planId)) || allRuns().some(r=>r.date>lastLog.date && r.date<=today);

    <div class="row between" style="flex-wrap:nowrap"><div style="min-width:0"><h2>${esc(next.name)}</h2><span class="small muted">${next.exercises.length} Übungen${adj}</span></div>

function strainWeekCard(){

const TYPE_DE={running:"Laufen",treadmill_running:"Laufband",trail_running:"Trailrun",floor_climbing:"Treppensteigen",stair_climbing:"Stairmaster",strength_training:"Krafttraining",hiit:"HIIT",indoor_cycling:"Velo indoor",cycling:"Velo",walking:"Gehen",hiking:"Wandern",indoor_rowing:"Rudern",elliptical:"Crosstrainer",cardio:"Cardio",yoga:"Yoga"};
function kindOf(t,n){ const x=(t||"")+" "+(n||""); return /run|lauf/i.test(x)?"lauf":/strength|kraft/i.test(x)?"kraft":/hiit|hyrox/i.test(x)?"hyrox":"other"; }
function dayEntries(d){
  const out=[]; const g=S.garmin.find(x=>x.date===d); const logs=S.logs.filter(l=>l.date===d); const used=new Set();
  (g?.activities||[]).forEach(a=>{
    const k=kindOf(a.type,a.name);
    let title=(a.name && !["Krafttraining","Treadmill Running","Running","Laufen"].includes(a.name))?a.name:(TYPE_DE[a.type]||a.name||"Aktivität");
    let extra="";
    if(k==="kraft"){ const l=logs.find(x=>!used.has(x.id)); if(l){ used.add(l.id); title=l.planName||title; const n=(l.entries||[]).reduce((s,e)=>s+(e.sets||[]).length,0); extra=`${(l.entries||[]).length} Übungen · ${n} Sätze`; } }
    out.push({k,title,start:a.start||"",sub:[a.start,a.min?Math.round(a.min)+" min":"",a.km?fmt1(a.km)+" km":"",a.avgHr?"Ø "+a.avgHr+" bpm":"",extra].filter(Boolean).join(" · "),s:Math.round(to21(trimp(a.min,a.avgHr||(k==="kraft"?110:130)))*10)/10});
  });
  logs.filter(l=>!used.has(l.id)).forEach(l=>{ const n=(l.entries||[]).reduce((s,e)=>s+(e.sets||[]).length,0); out.push({k:kindOf(l.planName,l.kind==="cardio"?"cardio":"kraft"),title:l.planName||"Training",start:"",sub:`${(l.entries||[]).length} Übungen · ${n} Sätze · ohne Uhr`,s:null}); });
  S.runs.filter(r=>r.date===d).forEach(r=>out.push({k:"lauf",title:"Lauf (manuell)",start:"",sub:[fmt1(r.km)+" km",r.min?r.min+" min":""].filter(Boolean).join(" · "),s:null}));
  return out.sort((a,b)=>(a.start||"99")<(b.start||"99")?-1:1);
}
